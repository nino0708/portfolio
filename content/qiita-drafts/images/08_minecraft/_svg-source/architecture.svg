<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" font-family="Hiragino Sans, Noto Sans JP, sans-serif">
  <rect width="1160" height="620" fill="#ffffff"/>

  <text x="30" y="42" font-size="24" font-weight="700" fill="#16191f">使う時だけ起動する Minecraft サーバー構成</text>
  <text x="30" y="68" font-size="14" fill="#5f6b7a">遊ぶ 3 時間だけ EC2 を生やし、終わったら消す。待機中に残るのはスナップショットだけ。</text>

  <!-- Players -->
  <rect x="30" y="120" width="180" height="200" rx="10" fill="#f7f9fb" stroke="#c9d2dd" stroke-width="1.5"/>
  <text x="120" y="150" font-size="15" font-weight="700" fill="#16191f" text-anchor="middle">プレイヤー</text>
  <text x="120" y="176" font-size="34" text-anchor="middle">👥</text>
  <text x="120" y="212" font-size="13" fill="#41505f" text-anchor="middle">自分 ＋ 友達</text>
  <text x="120" y="234" font-size="13" fill="#41505f" text-anchor="middle">Java版クライアント</text>
  <text x="120" y="268" font-size="12" fill="#5f6b7a" text-anchor="middle">高スペックPC不要</text>
  <text x="120" y="288" font-size="12" fill="#5f6b7a" text-anchor="middle">ストレージ消費なし</text>

  <!-- arrow players -> aws -->
  <line x1="210" y1="220" x2="286" y2="220" stroke="#7d8998" stroke-width="2" marker-end="url(#ah)"/>
  <text x="248" y="206" font-size="12" fill="#41505f" text-anchor="middle">TCP</text>
  <text x="248" y="243" font-size="12" font-weight="700" fill="#d97706" text-anchor="middle">25565</text>

  <!-- AWS Cloud -->
  <rect x="290" y="100" width="700" height="330" rx="10" fill="#ffffff" stroke="#232f3e" stroke-width="2"/>
  <text x="306" y="126" font-size="14" font-weight="700" fill="#232f3e">AWS Cloud</text>
  <text x="306" y="146" font-size="12" fill="#5f6b7a">ap-northeast-1 (東京)</text>

  <!-- VPC -->
  <rect x="312" y="160" width="420" height="248" rx="8" fill="#f4f8fd" stroke="#4a78c8" stroke-width="1.5"/>
  <text x="326" y="182" font-size="13" font-weight="700" fill="#2f5fa8">VPC (デフォルト)</text>

  <!-- Public subnet -->
  <rect x="330" y="196" width="384" height="196" rx="8" fill="#f1faf3" stroke="#3f9c5a" stroke-width="1.5"/>
  <text x="344" y="217" font-size="12" font-weight="700" fill="#2b7a43">パブリックサブネット</text>

  <!-- SG -->
  <rect x="346" y="228" width="352" height="148" rx="8" fill="#fff" stroke="#d13212" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="358" y="247" font-size="12" font-weight="700" fill="#d13212">セキュリティグループ  22 / 25565</text>

  <!-- EC2 box -->
  <rect x="362" y="258" width="320" height="102" rx="8" fill="#fff4ec" stroke="#ec7211" stroke-width="1.8"/>
  <text x="378" y="281" font-size="14" font-weight="700" fill="#a8460b">EC2  t4g.medium</text>
  <text x="378" y="303" font-size="12" fill="#41505f">2 vCPU / メモリ 4 GiB / Arm (Graviton)</text>
  <text x="378" y="323" font-size="12" fill="#41505f">Amazon Linux 2023 ＋ Java ＋ server.jar</text>
  <text x="378" y="345" font-size="12" fill="#41505f">EBS gp3 8 GiB（ルートボリューム）</text>
  <text x="668" y="281" font-size="20" text-anchor="end">🖥</text>

  <!-- Storage column -->
  <rect x="752" y="160" width="220" height="248" rx="8" fill="#faf7fd" stroke="#8b5cd6" stroke-width="1.5"/>
  <text x="766" y="182" font-size="13" font-weight="700" fill="#6d3fbb">待機中も残すもの</text>

  <rect x="766" y="196" width="192" height="88" rx="7" fill="#fff" stroke="#8b5cd6" stroke-width="1.3"/>
  <text x="780" y="218" font-size="13" font-weight="700" fill="#16191f">① AMI</text>
  <text x="780" y="239" font-size="11.5" fill="#41505f">＝起動テンプレート</text>
  <text x="780" y="257" font-size="11.5" fill="#41505f">実体は EBS スナップショット</text>
  <text x="780" y="275" font-size="11.5" font-weight="700" fill="#6d3fbb">$0.05 / GB・月</text>

  <rect x="766" y="296" width="192" height="96" rx="7" fill="#fff" stroke="#8b5cd6" stroke-width="1.3"/>
  <text x="780" y="318" font-size="13" font-weight="700" fill="#16191f">② EBS スナップショット</text>
  <text x="780" y="339" font-size="11.5" fill="#41505f">＝ワールドのバックアップ</text>
  <text x="780" y="357" font-size="11.5" fill="#41505f">遊び終わりに取得</text>
  <text x="780" y="375" font-size="11.5" font-weight="700" fill="#6d3fbb">$0.05 / GB・月</text>

  <line x1="682" y1="290" x2="762" y2="240" stroke="#8b5cd6" stroke-width="1.8" marker-end="url(#ahp)"/>
  <line x1="682" y1="330" x2="762" y2="340" stroke="#8b5cd6" stroke-width="1.8" marker-end="url(#ahp)"/>

  <!-- Lifecycle -->
  <text x="30" y="478" font-size="17" font-weight="700" fill="#16191f">1 回のプレイのライフサイクル</text>

  <rect x="30" y="496" width="1100" height="94" rx="10" fill="#f7f9fb" stroke="#c9d2dd" stroke-width="1.5"/>

  <g font-size="12.5" fill="#16191f">
    <rect x="46" y="516" width="150" height="56" rx="7" fill="#fff" stroke="#c9d2dd"/>
    <text x="121" y="539" text-anchor="middle" font-weight="700">① AMIから起動</text>
    <text x="121" y="558" text-anchor="middle" fill="#5f6b7a">約2〜3分</text>

    <rect x="238" y="516" width="150" height="56" rx="7" fill="#fff" stroke="#c9d2dd"/>
    <text x="313" y="539" text-anchor="middle" font-weight="700">② IPを共有</text>
    <text x="313" y="558" text-anchor="middle" fill="#5f6b7a">毎回変わる</text>

    <rect x="430" y="516" width="180" height="56" rx="7" fill="#fff8e6" stroke="#d97706" stroke-width="1.8"/>
    <text x="520" y="539" text-anchor="middle" font-weight="700" fill="#a8600b">③ 遊ぶ（3時間）</text>
    <text x="520" y="558" text-anchor="middle" fill="#a8600b">ここだけ時間課金</text>

    <rect x="652" y="516" width="180" height="56" rx="7" fill="#fff" stroke="#c9d2dd"/>
    <text x="742" y="539" text-anchor="middle" font-weight="700">④ スナップショット取得</text>
    <text x="742" y="558" text-anchor="middle" fill="#5f6b7a">ワールドを保存</text>

    <rect x="874" y="516" width="240" height="56" rx="7" fill="#f1faf3" stroke="#3f9c5a" stroke-width="1.8"/>
    <text x="994" y="539" text-anchor="middle" font-weight="700" fill="#2b7a43">⑤ インスタンスを削除</text>
    <text x="994" y="558" text-anchor="middle" fill="#2b7a43">時間課金ゼロに戻る</text>
  </g>
  <g stroke="#7d8998" stroke-width="2" marker-end="url(#ah)">
    <line x1="198" y1="544" x2="232" y2="544"/>
    <line x1="390" y1="544" x2="424" y2="544"/>
    <line x1="612" y1="544" x2="646" y2="544"/>
    <line x1="834" y1="544" x2="868" y2="544"/>
  </g>

  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d8998"/>
    </marker>
    <marker id="ahp" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#8b5cd6"/>
    </marker>
  </defs>
</svg>
