<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
  :root{ --ink:#0B0C0E; --line:#23262C; --paper:#ECEAE3; --accent:#FB4D27; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:400px;height:400px}
  body{background:var(--ink);position:relative;overflow:hidden}
  .grid{position:absolute;inset:0;opacity:.45;
    background:
      linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/50px 100%,
      linear-gradient(0deg,var(--line) 1px,transparent 1px) 0 0/100% 50px;
    -webkit-mask:radial-gradient(circle at 50% 44%, #000 28%, transparent 80%);
            mask:radial-gradient(circle at 50% 44%, #000 28%, transparent 80%);}
  .frame{position:absolute;inset:22px;border:1px solid #2C3038}

  /* ジオメトリックな F: 白い縦軸 + 朱の腕。48pxまで崩れない */
  .mark{position:absolute;left:50%;top:184px;transform:translate(-50%,-50%);
    width:188px;height:212px}
  .stem{position:absolute;left:0;top:0;width:52px;height:212px;background:var(--paper)}
  .arm{position:absolute;left:0;height:50px;background:var(--accent)}
  .arm.top{top:0;width:188px}
  .arm.mid{top:84px;width:132px}
  /* 軸と腕の交点を白で締める(段差をきれいに) */
  .joint{position:absolute;left:0;width:52px;background:var(--paper)}
  .joint.j1{top:50px;height:34px}
  .joint.j2{top:134px;height:78px}

  .foot{position:absolute;left:0;right:0;bottom:46px;text-align:center}
  .foot .nm{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:27px;
    color:var(--paper);letter-spacing:.2em}
  .foot .en{font-family:"Space Mono",monospace;font-weight:700;font-size:12px;
    letter-spacing:.52em;color:var(--accent);text-transform:uppercase;margin-top:9px}

  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 50% 30%, transparent 58%, rgba(0,0,0,.5) 100%)}
  .grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none}
</style>
</head>
<body>
  <div class="grid"></div>

  <div class="mark">
    <span class="arm top"></span>
    <span class="arm mid"></span>
    <span class="joint j1"></span>
    <span class="joint j2"></span>
    <span class="stem"></span>
  </div>

  <div class="foot">
    <div class="nm">Friday商事</div>
    <div class="en">Select &amp; Resell</div>
  </div>

  <div class="frame"></div>
  <div class="vignette"></div>
  <svg class="grain"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</body>
</html>
