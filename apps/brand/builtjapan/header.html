<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Noto+Sans+JP:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F6F9;        /* 図面紙 */
    --paper2:#EAEEF4;
    --brand:#1F5FAE;        /* 既存サイトの青 */
    --brand-d:#16243A;      /* 製図のインク濃紺 */
    --brand-l:#9CC0EC;
    --accent:#D98324;       /* 既存サイトの琥珀 */
    --ink:#1B2330;
    --muted:#5B6675;
    --line:#D6DEEA;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1500px;height:500px}
  body{font-family:"Fraunces","Noto Sans JP",serif;background:var(--paper);
    color:var(--ink);position:relative;overflow:hidden}

  /* ブループリントの方眼(細・太の2層) */
  .grid{position:absolute;inset:0;pointer-events:none;opacity:.9;
    background:
      linear-gradient(90deg, rgba(31,95,174,.06) 1px, transparent 1px) 0 0/30px 100%,
      linear-gradient(0deg,  rgba(31,95,174,.06) 1px, transparent 1px) 0 0/100% 30px,
      linear-gradient(90deg, rgba(31,95,174,.10) 1px, transparent 1px) 0 0/150px 100%,
      linear-gradient(0deg,  rgba(31,95,174,.10) 1px, transparent 1px) 0 0/100% 150px;}
  .paperwash{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 120% at 18% 12%, #FFFFFF 0%, transparent 55%);}

  .skyline{position:absolute;left:0;bottom:0;width:1500px;height:500px;pointer-events:none}
  /* 左テキスト帯の下にだけ紙のかすみを敷き、文字を線画から浮かせる */
  .leftwash{position:absolute;left:0;top:0;width:640px;height:500px;pointer-events:none;
    background:linear-gradient(90deg, rgba(244,246,249,.94) 0%, rgba(244,246,249,.9) 52%, transparent 100%)}

  .stage{position:absolute;inset:0;padding:58px 80px}

  .kicker{display:flex;align-items:center;gap:14px;
    font-family:"Space Mono",monospace;font-size:15px;letter-spacing:.36em;
    color:var(--muted);text-transform:uppercase}
  .kicker .sq{width:9px;height:9px;background:var(--accent)}
  .kicker b{color:var(--brand);font-weight:700;letter-spacing:.36em}

  .word{margin-top:24px;font-family:"Fraunces",serif;font-weight:600;
    font-size:96px;line-height:.96;letter-spacing:-.012em;color:var(--brand-d)}
  .word .tw{color:var(--accent);font-style:italic;font-weight:600}
  .journal{margin-top:10px;display:flex;align-items:center;gap:20px}
  .journal .rule{width:64px;height:2px;background:var(--brand-d)}
  .journal .jl{font-family:"Noto Sans JP",sans-serif;font-weight:700;font-size:21px;
    letter-spacing:.3em;color:var(--brand-d)}

  .tagline{margin-top:30px;font-family:"Noto Sans JP",sans-serif;font-weight:700;
    font-size:25px;letter-spacing:.06em;color:var(--ink)}
  .tagline .en{display:block;margin-top:8px;font-family:"Space Mono",monospace;
    font-weight:400;font-size:14px;letter-spacing:.12em;color:var(--muted)}

  /* 右上: 製図カルトゥーシュ(方位・スケール・座標) */
  .carto{position:absolute;right:74px;top:58px;width:250px;
    border:1.5px solid var(--brand-d);background:rgba(244,246,249,.7);
    font-family:"Space Mono",monospace;color:var(--brand-d)}
  .carto .hd{display:flex;justify-content:space-between;align-items:center;
    padding:9px 14px;border-bottom:1.5px solid var(--brand-d);font-size:12px;
    letter-spacing:.22em}
  .carto .body{padding:14px;display:flex;gap:16px;align-items:center}
  .compass{width:52px;height:52px;flex:0 0 52px;position:relative}
  .compass .n{position:absolute;left:50%;top:-2px;transform:translateX(-50%);
    font-size:12px;font-weight:700;color:var(--accent)}
  .scale{flex:1}
  .scale .bar{display:flex;height:10px;border:1.2px solid var(--brand-d)}
  .scale .bar i{flex:1;border-right:1.2px solid var(--brand-d)}
  .scale .bar i:nth-child(odd){background:var(--brand-d)}
  .scale .bar i:last-child{border-right:0}
  .scale .lbl{display:flex;justify-content:space-between;font-size:10px;margin-top:4px;
    letter-spacing:.1em}
  .coords{margin-top:10px;padding:0 14px 12px;font-size:11px;letter-spacing:.12em;
    color:var(--muted)}
  .coords span{color:var(--brand-d)}

  /* 右下メタ */
  .meta{position:absolute;right:80px;bottom:46px;text-align:right;
    font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.18em;color:var(--muted)}
  .meta .h{color:var(--brand-d);font-weight:700}

  /* 高さ注記(琥珀のリーダー線) */
  .annot{position:absolute;font-family:"Space Mono",monospace;font-size:12px;
    letter-spacing:.16em;color:var(--accent)}
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="paperwash"></div>

  <!-- 東京スカイラインの立面図 -->
  <svg class="skyline" viewBox="0 0 1500 500" fill="none" preserveAspectRatio="none">
    <defs>
      <pattern id="win" width="13" height="18" patternUnits="userSpaceOnUse">
        <rect x="2.5" y="3" width="5" height="8" fill="#1F5FAE" opacity="0.16"/>
      </pattern>
      <pattern id="winA" width="13" height="18" patternUnits="userSpaceOnUse">
        <rect x="2.5" y="3" width="5" height="8" fill="#D98324" opacity="0.30"/>
      </pattern>
    </defs>
    <!-- 地平線 -->
    <line x1="0" y1="455" x2="1500" y2="455" stroke="#16243A" stroke-width="2"/>
    <g stroke="#1F5FAE" stroke-width="2">
      <!-- 一般ビル群(青) -->
      <rect x="40"   y="338" width="66" height="117" fill="url(#win)"/>
      <rect x="116"  y="378" width="48" height="77"  fill="url(#win)"/>
      <rect x="176"  y="266" width="82" height="189" fill="url(#win)"/>
        <rect x="196" y="246" width="42" height="22" fill="#F4F6F9"/>
      <rect x="270"  y="322" width="54" height="133" fill="url(#win)"/>
      <rect x="336"  y="292" width="92" height="163" fill="url(#win)"/>
      <rect x="442"  y="360" width="58" height="95"  fill="url(#win)"/>
      <rect x="512"  y="214" width="74" height="241" fill="url(#win)"/>
        <rect x="540" y="196" width="18" height="20" fill="#F4F6F9"/>
      <!-- 右側 -->
      <rect x="724"  y="345" width="60" height="110" fill="url(#win)"/>
      <rect x="794"  y="280" width="80" height="175" fill="url(#win)"/>
      <rect x="884"  y="362" width="46" height="93"  fill="url(#win)"/>
      <rect x="942"  y="238" width="70" height="217" fill="url(#win)"/>
      <rect x="1024" y="312" width="58" height="143" fill="url(#win)"/>
      <rect x="1092" y="360" width="50" height="95"  fill="url(#win)"/>
    </g>

    <!-- ヒーロー: 最も高いタワー(琥珀) -->
    <g>
      <rect x="616" y="150" width="92" height="305" fill="url(#winA)" stroke="#D98324" stroke-width="2.5"/>
      <rect x="640" y="128" width="44" height="24" fill="#F4F6F9" stroke="#D98324" stroke-width="2.5"/>
      <line x1="662" y1="128" x2="662" y2="96" stroke="#D98324" stroke-width="2.5"/>
      <circle cx="662" cy="92" r="5" fill="#D98324"/>
    </g>

    <!-- Skytree風の細い尖塔(青・右奥) -->
    <g stroke="#1F5FAE" stroke-width="2">
      <path d="M1158 455 L1170 250 L1182 455 Z" fill="url(#win)"/>
      <line x1="1170" y1="250" x2="1170" y2="150" stroke="#1F5FAE" stroke-width="2"/>
      <circle cx="1170" cy="150" r="3.5" fill="#1F5FAE"/>
    </g>
  </svg>

  <div class="leftwash"></div>

  <!-- ヒーロータワーの高さ注記 -->
  <div class="annot" style="left:712px;top:96px;">┄┄ 390 m</div>

  <div class="stage">
    <div class="kicker"><span class="sq"></span>TOKYO&nbsp;&nbsp;·&nbsp;&nbsp;<b>@builtjapan</b>&nbsp;&nbsp;·&nbsp;&nbsp;EST. 2026</div>

    <div class="word">Built <span class="tw">Japan</span></div>
    <div class="journal"><span class="rule"></span><span class="jl">東京建築アーカイブ</span></div>

    <div class="tagline">
      東京の空をつくる、巨大建築の記録。
      <span class="en">A record of the giant buildings shaping Tokyo&rsquo;s skyline.</span>
    </div>
  </div>

  <!-- 製図カルトゥーシュ -->
  <div class="carto">
    <div class="hd"><span>ELEVATION</span><span>立面 / 01</span></div>
    <div class="body">
      <div class="compass">
        <span class="n">N</span>
        <svg width="52" height="52" viewBox="0 0 52 52">
          <circle cx="26" cy="26" r="22" stroke="#16243A" stroke-width="1.2" fill="none"/>
          <path d="M26 8 L31 28 L26 24 L21 28 Z" fill="#16243A"/>
          <path d="M26 44 L21 26 L26 30 L31 26 Z" fill="none" stroke="#16243A" stroke-width="1"/>
        </svg>
      </div>
      <div class="scale">
        <div class="bar"><i></i><i></i><i></i><i></i></div>
        <div class="lbl"><span>0</span><span>500 m</span></div>
      </div>
    </div>
    <div class="coords">35.6586&deg;N&nbsp;&nbsp;<span>139.7454&deg;E</span>&nbsp;&nbsp;TOKYO</div>
  </div>

  <div class="meta">
    <div class="h">@builtjapan</div>
    <div>HIGH-RISE &nbsp;/&nbsp; 日英バイリンガル</div>
  </div>
</body>
</html>
