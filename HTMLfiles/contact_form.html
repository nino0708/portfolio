<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #1a73e8;
      --brand-dark: #1557b0;
      --hero-from: #1a237e;
      --hero-mid: #4527a0;
      --hero-to: #6a1b9a;
      --bg: #f8f9fc;
      --surface: #ffffff;
      --border: #e0e3ea;
      --border-focus: #1a73e8;
      --text: #202124;
      --text-secondary: #5f6368;
      --text-hint: #9aa0a6;
      --error: #d32f2f;
      --error-bg: #fce8e6;
      --error-border: rgba(211, 47, 47, 0.28);
      --success: #1e8e3e;
      --success-bg: #e6f4ea;
      --radius-card: 14px;
      --radius-input: 8px;
      --shadow-card: 0 2px 6px rgba(0, 0, 0, 0.08), 0 1px 2px rgba(0, 0, 0, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Hero Banner ────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, var(--hero-from) 0%, var(--hero-mid) 50%, var(--hero-to) 100%);
      padding: 2.75rem 1rem 4rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-inner {
      position: relative;
      max-width: 560px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 100px;
      padding: 5px 16px;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.92);
      margin-bottom: 1rem;
      letter-spacing: 0.03em;
    }
    .hero-badge .material-symbols-outlined {
      font-size: 15px;
      vertical-align: middle;
    }
    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.6rem;
      letter-spacing: -0.01em;
    }
    .hero p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.72);
      line-height: 1.7;
    }

    /* ── Main ────────────────────────────────────── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem 3rem;
      margin-top: -2rem;
    }

    /* ── Card ────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 2rem 2rem 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: var(--shadow-card);
    }

    h2 {
      font-size: 17px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.3rem;
    }
    .subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1.75rem;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .required { color: var(--error); }
    .field { margin-bottom: 1rem; }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-input);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: var(--surface);
      color: var(--text);
    }
    input:focus,
    textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.12);
    }
    input::placeholder,
    textarea::placeholder {
      color: var(--text-hint);
    }
    textarea { resize: vertical; }

    .char-count {
      font-size: 12px;
      color: var(--text-hint);
      text-align: right;
      margin-top: 4px;
    }
    .char-count.over { color: var(--error); }

    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      background: var(--brand-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-input);
      transition: background 0.15s, box-shadow 0.15s;
      letter-spacing: 0.01em;
    }
    .btn-submit:hover {
      background: var(--brand-dark);
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.35);
    }
    .btn-submit:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ── Success state ───────────────────────────── */
    .success-wrap {
      display: none;
      text-align: center;
      padding: 2rem 0;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .success-icon .material-symbols-outlined {
      font-size: 28px;
      color: var(--success);
      font-variation-settings: 'FILL' 1;
    }
    .success-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .success-body {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
      line-height: 1.7;
    }
    .btn-reset {
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 24px;
      background: transparent;
      color: var(--brand-primary);
      border: 1.5px solid var(--brand-primary);
      border-radius: 8px;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: rgba(26, 115, 232, 0.06); }

    /* ── Footer ──────────────────────────────────── */
    .page-footer {
      text-align: center;
      padding: 1.5rem 1rem;
      font-size: 12px;
      color: var(--text-hint);
    }
  </style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-badge">
      <span class="material-symbols-outlined">mail</span>
      お問い合わせフォーム
    </div>
    <h1>お気軽にご連絡ください</h1>
    <p>ご質問・ご意見をお待ちしております。<br>通常 1〜2 営業日以内にご返信いたします。</p>
  </div>
</div>

<div class="main">
  <div class="card">
    <h2>お問い合わせ</h2>
    <p class="subtitle">ご質問・ご意見はこちらからお送りください。</p>

    <div id="form-body">
      <div class="field">
        <label>お名前 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="山田 太郎">
      </div>
      <div class="field">
        <label>メールアドレス <span class="required">*</span></label>
        <input type="email" id="email" placeholder="taro@example.com">
      </div>
      <div class="field">
        <label>件名</label>
        <input type="text" id="subject" placeholder="お問い合わせの件名">
      </div>
      <div class="field" style="margin-bottom:1.5rem;">
        <label>お問い合わせ内容 <span class="required">*</span></label>
        <textarea id="message" rows="5" placeholder="ご質問・ご意見をご記入ください"></textarea>
        <div id="char-count" class="char-count">0 / 500文字</div>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button id="submit-btn" class="btn-submit" onclick="handleSubmit()">送信する</button>
    </div>

    <div id="success-msg" class="success-wrap">
      <div class="success-icon">
        <span class="material-symbols-outlined">check_circle</span>
      </div>
      <p class="success-title">送信が完了しました</p>
      <p class="success-body">お問い合わせありがとうございます。<br>内容を確認次第、ご連絡いたします。</p>
      <button onclick="resetForm()" class="btn-reset">新しいお問い合わせ</button>
    </div>
  </div>

  <div class="page-footer">Nino's Portfolio &nbsp;·&nbsp; お問い合わせはいつでも受け付けています</div>
</div>

<script>
  const API_ENDPOINT = "https://owk15xpdx7.execute-api.us-east-1.amazonaws.com/prod/contact";
  const MAX = 500;
  const msgEl = document.getElementById('message');
  const countEl = document.getElementById('char-count');

  msgEl.addEventListener('input', () => {
    const len = msgEl.value.length;
    countEl.textContent = len + ' / ' + MAX + '文字';
    countEl.className = 'char-count' + (len > MAX ? ' over' : '');
  });

  async function handleSubmit() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    if (!name || !email || !message) {
      errEl.textContent = '※ お名前・メールアドレス・お問い合わせ内容は必須項目です。';
      errEl.style.display = 'block';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errEl.textContent = '※ 正しいメールアドレスを入力してください。';
      errEl.style.display = 'block';
      return;
    }
    if (message.length > MAX) {
      errEl.textContent = '※ お問い合わせ内容は' + MAX + '文字以内で入力してください。';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '送信中...';

    try {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message })
      });

      if (!res.ok) throw new Error('API error: ' + res.status);

      document.getElementById('form-body').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    } catch (e) {
      errEl.textContent = '※ 送信に失敗しました。しばらくしてから再度お試しください。';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送信する';
    }
  }

  function resetForm() {
    ['name', 'email', 'subject', 'message'].forEach(id => {
      document.getElementById(id).value = '';
    });
    countEl.textContent = '0 / ' + MAX + '文字';
    countEl.className = 'char-count';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('form-body').style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = '送信する';
  }
</script>
</body>
</html>
