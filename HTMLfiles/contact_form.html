<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">
  <style>
    :root {
      --primary:        #4f6af0;
      --primary-dark:   #3b52c9;
      --accent:         #7c4dff;
      --gradient:       linear-gradient(135deg, #4f6af0 0%, #7c4dff 100%);
      --bg:             #eff1fb;
      --surface:        #ffffff;
      --border:         #e2e5f4;
      --text:           #1c1e30;
      --text-muted:     #64748b;
      --error:          #ef4444;
      --error-bg:       #fef2f2;
      --error-border:   #fca5a5;
      --success:        #10b981;
      --radius:         20px;
      --radius-sm:      10px;
      --shadow:         0 8px 32px rgba(79,106,240,.10), 0 2px 8px rgba(0,0,0,.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', -apple-system, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* Card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    /* Gradient hero header */
    .card-hero {
      background: var(--gradient);
      padding: 1.75rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .card-hero-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,.20);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-hero-icon .material-symbols-outlined {
      font-size: 24px;
      color: #fff;
    }
    .card-hero-text h2 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .card-hero-text p {
      font-size: 13px;
      color: rgba(255,255,255,.82);
      margin-top: 2px;
    }

    /* Card body */
    .card-body { padding: 2rem; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: .02em;
    }
    .required { color: var(--error); }
    .field { margin-bottom: 1rem; }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      color: var(--text);
      background: #fafbff;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,106,240,.12);
      background: #fff;
    }
    textarea { resize: vertical; }

    .char-count {
      font-size: 11px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
    }
    .char-count.over { color: var(--error); }

    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 1rem;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      background: var(--gradient);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      transition: opacity .15s, transform .1s;
      letter-spacing: .02em;
    }
    .btn-submit:hover   { opacity: .90; transform: translateY(-1px); }
    .btn-submit:active  { transform: translateY(0); }
    .btn-submit:disabled { opacity: .55; cursor: not-allowed; transform: none; }

    /* Success state */
    .success-wrap {
      display: none;
      text-align: center;
      padding: 2.5rem 2rem;
    }
    .success-icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.25rem;
      box-shadow: 0 4px 16px rgba(16,185,129,.30);
    }
    .success-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: .5rem;
    }
    .success-body {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.7;
    }
    .btn-reset {
      font-size: 13px;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      padding: 9px 24px;
      background: transparent;
      color: var(--primary);
      border: 1.5px solid var(--primary);
      border-radius: var(--radius-sm);
      transition: background .15s;
    }
    .btn-reset:hover { background: rgba(79,106,240,.06); }
  </style>
</head>
<body>
<div class="card">
  <div class="card-hero">
    <div class="card-hero-icon">
      <span class="material-symbols-outlined">mail</span>
    </div>
    <div class="card-hero-text">
      <h2>お問い合わせ</h2>
      <p>ご質問・ご意見はこちらからお送りください。</p>
    </div>
  </div>

  <div class="card-body">
    <div id="form-body">
      <div class="field">
        <label>お名前 <span class="required">*</span></label>
        <input type="text" id="name" placeholder="山田 太郎">
      </div>
      <div class="field">
        <label>メールアドレス <span class="required">*</span></label>
        <input type="email" id="email" placeholder="taro@example.com">
      </div>
      <div class="field">
        <label>件名</label>
        <input type="text" id="subject" placeholder="お問い合わせの件名">
      </div>
      <div class="field" style="margin-bottom:1.5rem;">
        <label>お問い合わせ内容 <span class="required">*</span></label>
        <textarea id="message" rows="5" placeholder="ご質問・ご意見をご記入ください"></textarea>
        <div id="char-count" class="char-count">0 / 500文字</div>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button id="submit-btn" class="btn-submit" onclick="handleSubmit()">送信する</button>
    </div>

    <div id="success-msg" class="success-wrap">
      <div class="success-icon">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
          <path d="M6 13l5.5 5.5L20 8" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="success-title">送信が完了しました</p>
      <p class="success-body">お問い合わせありがとうございます。<br>内容を確認次第、ご連絡いたします。</p>
      <button onclick="resetForm()" class="btn-reset">新しいお問い合わせ</button>
    </div>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://owk15xpdx7.execute-api.us-east-1.amazonaws.com/prod/contact";
  const MAX = 500;
  const msgEl = document.getElementById('message');
  const countEl = document.getElementById('char-count');

  msgEl.addEventListener('input', () => {
    const len = msgEl.value.length;
    countEl.textContent = len + ' / ' + MAX + '文字';
    countEl.className = 'char-count' + (len > MAX ? ' over' : '');
  });

  async function handleSubmit() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    if (!name || !email || !message) {
      errEl.textContent = '※ お名前・メールアドレス・お問い合わせ内容は必須項目です。';
      errEl.style.display = 'block';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errEl.textContent = '※ 正しいメールアドレスを入力してください。';
      errEl.style.display = 'block';
      return;
    }
    if (message.length > MAX) {
      errEl.textContent = '※ お問い合わせ内容は' + MAX + '文字以内で入力してください。';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '送信中...';

    try {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message })
      });

      if (!res.ok) throw new Error('API error: ' + res.status);

      document.getElementById('form-body').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    } catch (e) {
      errEl.textContent = '※ 送信に失敗しました。しばらくしてから再度お試しください。';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送信する';
    }
  }

  function resetForm() {
    ['name', 'email', 'subject', 'message'].forEach(id => {
      document.getElementById(id).value = '';
    });
    countEl.textContent = '0 / ' + MAX + '文字';
    countEl.className = 'char-count';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('form-body').style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = '送信する';
  }
</script>
</body>
</html>
