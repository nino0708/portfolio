<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a73e8;
      --primary-hover: #1557b0;
      --primary-light: #e8f0fe;
      --primary-ring: rgba(26, 115, 232, 0.15);
      --bg: #f1f3f9;
      --surface: #ffffff;
      --border: #dadce0;
      --text: #202124;
      --text-muted: #5f6368;
      --error: #d93025;
      --error-bg: #fce8e6;
      --error-border: #f5c6c2;
      --success: #1e8e3e;
      --success-bg: #e6f4ea;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 1px 3px rgba(60,64,67,0.08), 0 4px 12px rgba(60,64,67,0.06);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1a73e8 0%, #7c4dff 100%);
    }
    h2 {
      font-size: 20px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.25rem;
      margin-top: 0.5rem;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .required { color: var(--error); }
    .field { margin-bottom: 1.1rem; }
    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      font-family: inherit;
      color: var(--text);
      background: var(--surface);
    }
    input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-ring);
    }
    textarea { resize: vertical; }
    .char-count {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
      margin-top: 4px;
    }
    .char-count.over { color: var(--error); }
    .error-msg {
      display: none;
      background: var(--error-bg);
      border: 1px solid var(--error-border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--error);
      margin-bottom: 1rem;
    }
    .btn-submit {
      width: 100%;
      padding: 11px;
      font-size: 15px;
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      transition: background 0.15s, box-shadow 0.15s;
      font-family: inherit;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      box-shadow: 0 2px 8px rgba(26, 115, 232, 0.28);
    }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
    .success-wrap {
      display: none;
      text-align: center;
      padding: 2rem 0;
    }
    .success-icon {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: var(--success-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .success-title {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.5rem;
    }
    .success-body {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      line-height: 1.65;
    }
    .btn-reset {
      font-size: 14px;
      cursor: pointer;
      padding: 10px 24px;
      background: var(--primary-light);
      color: var(--primary);
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-reset:hover { background: #d2e3fc; }
  </style>
</head>
<body>
<div class="card">
  <h2>お問い合わせ</h2>
  <p class="subtitle">ご質問・ご意見はこちらからお送りください。</p>

  <div id="form-body">
    <div class="field">
      <label>お名前 <span class="required">*</span></label>
      <input type="text" id="name" placeholder="山田 太郎">
    </div>
    <div class="field">
      <label>メールアドレス <span class="required">*</span></label>
      <input type="email" id="email" placeholder="taro@example.com">
    </div>
    <div class="field">
      <label>件名</label>
      <input type="text" id="subject" placeholder="お問い合わせの件名">
    </div>
    <div class="field" style="margin-bottom:1.5rem;">
      <label>お問い合わせ内容 <span class="required">*</span></label>
      <textarea id="message" rows="5" placeholder="ご質問・ご意見をご記入ください"></textarea>
      <div id="char-count" class="char-count">0 / 500文字</div>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <button id="submit-btn" class="btn-submit" onclick="handleSubmit()">送信する</button>
  </div>

  <div id="success-msg" class="success-wrap">
    <div class="success-icon">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <path d="M6 13l5.5 5.5L20 8" stroke="#1e8e3e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <p class="success-title">送信が完了しました</p>
    <p class="success-body">お問い合わせありがとうございます。<br>内容を確認次第、ご連絡いたします。</p>
    <button onclick="resetForm()" class="btn-reset">新しいお問い合わせ</button>
  </div>
</div>

<script>
  const API_ENDPOINT = "https://owk15xpdx7.execute-api.us-east-1.amazonaws.com/prod/contact";
  const MAX = 500;
  const msgEl = document.getElementById('message');
  const countEl = document.getElementById('char-count');

  msgEl.addEventListener('input', () => {
    const len = msgEl.value.length;
    countEl.textContent = len + ' / ' + MAX + '文字';
    countEl.className = 'char-count' + (len > MAX ? ' over' : '');
  });

  async function handleSubmit() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const subject = document.getElementById('subject').value.trim();
    const message = document.getElementById('message').value.trim();
    const errEl = document.getElementById('error-msg');
    const btn = document.getElementById('submit-btn');

    errEl.style.display = 'none';

    if (!name || !email || !message) {
      errEl.textContent = '※ お名前・メールアドレス・お問い合わせ内容は必須項目です。';
      errEl.style.display = 'block';
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errEl.textContent = '※ 正しいメールアドレスを入力してください。';
      errEl.style.display = 'block';
      return;
    }
    if (message.length > MAX) {
      errEl.textContent = '※ お問い合わせ内容は' + MAX + '文字以内で入力してください。';
      errEl.style.display = 'block';
      return;
    }

    btn.disabled = true;
    btn.textContent = '送信中...';

    try {
      const res = await fetch(API_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, subject, message })
      });

      if (!res.ok) throw new Error('API error: ' + res.status);

      document.getElementById('form-body').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    } catch (e) {
      errEl.textContent = '※ 送信に失敗しました。しばらくしてから再度お試しください。';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = '送信する';
    }
  }

  function resetForm() {
    ['name', 'email', 'subject', 'message'].forEach(id => {
      document.getElementById(id).value = '';
    });
    countEl.textContent = '0 / ' + MAX + '文字';
    countEl.className = 'char-count';
    document.getElementById('error-msg').style.display = 'none';
    document.getElementById('form-body').style.display = 'block';
    document.getElementById('success-msg').style.display = 'none';
    document.getElementById('submit-btn').disabled = false;
    document.getElementById('submit-btn').textContent = '送信する';
  }
</script>
</body>
</html>
