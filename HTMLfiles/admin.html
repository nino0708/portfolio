<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 - お問い合わせ一覧</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #181818;
      --border: #2a2a2a;
      --border-light: #333;
      --text: #e8e8e8;
      --text-muted: #666;
      --text-dim: #444;
      --accent: #c8f55a;
      --accent-dim: rgba(200, 245, 90, 0.12);
      --danger: #ff5f5f;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Noto Sans JP', sans-serif;
      /* Stat card accent colors */
      --stat-total-color: #5B9CF6;
      --stat-total-bg: rgba(91,156,246,.10);
      --stat-today-color: #4ECDA4;
      --stat-today-bg: rgba(78,205,164,.10);
      --stat-updated-color: #A78BFA;
      --stat-updated-bg: rgba(167,139,250,.10);
      /* Header accent gradient */
      --header-accent: linear-gradient(90deg, #5B9CF6 0%, #A78BFA 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
    }

    /* Header accent line */
    .header-accent-line {
      height: 3px;
      background: var(--header-accent);
      position: sticky;
      top: 0;
      z-index: 101;
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 3px;
      background: var(--bg);
      z-index: 100;
    }
    .logo {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo .material-symbols-outlined {
      font-size: 16px;
      color: var(--stat-total-color);
      font-variation-settings: 'FILL' 0;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .status-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .status-text {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 59px);
      padding: 2rem;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem;
      width: 100%;
      max-width: 360px;
    }
    .login-card h2 {
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 0.5rem;
      letter-spacing: 0.05em;
    }
    .login-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .field { margin-bottom: 1rem; }
    .field label {
      display: block;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .field input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-light);
      border-radius: 2px;
      padding: 9px 12px;
      font-size: 13px;
      color: var(--text);
      font-family: var(--mono);
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus { border-color: var(--accent); }
    .btn-login {
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 2px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 500;
      color: #0f0f0f;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s;
      letter-spacing: 0.05em;
    }
    .btn-login:hover { opacity: 0.85; }
    .login-error {
      display: none;
      font-size: 12px;
      color: var(--danger);
      margin-top: 0.75rem;
      font-family: var(--mono);
    }

    /* Dashboard */
    #dashboard { display: none; }
    .container { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 2rem;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.15s;
    }
    .stat::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }
    .stat-total::before  { background: var(--stat-total-color); }
    .stat-today::before  { background: var(--stat-today-color); }
    .stat-updated::before { background: var(--stat-updated-color); }

    .stat-icon {
      position: absolute;
      top: 1.1rem; right: 1.25rem;
      font-size: 20px;
      opacity: 0.5;
    }
    .stat-total   .stat-icon { color: var(--stat-total-color); }
    .stat-today   .stat-icon { color: var(--stat-today-color); }
    .stat-updated .stat-icon { color: var(--stat-updated-color); }

    .stat-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }
    .stat-value {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 500;
    }
    .stat-total   .stat-value { color: var(--stat-total-color); }
    .stat-today   .stat-value { color: var(--stat-today-color); }
    .stat-updated .stat-value { color: var(--stat-updated-color); font-size: 16px; padding-top: 6px; }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .section-title {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Search input with icon */
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrap .material-symbols-outlined {
      position: absolute;
      left: 9px;
      font-size: 15px;
      color: var(--text-dim);
      pointer-events: none;
    }
    .search-input {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 2px;
      padding: 7px 12px 7px 30px;
      font-size: 13px;
      color: var(--text);
      font-family: var(--mono);
      outline: none;
      width: 220px;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--text-dim); }

    .btn-refresh {
      background: transparent;
      border: 1px solid var(--border-light);
      border-radius: 2px;
      padding: 7px 12px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .btn-refresh .material-symbols-outlined {
      font-size: 14px;
    }
    .btn-refresh:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* Logout button */
    #logout-btn .material-symbols-outlined {
      font-size: 13px;
    }

    /* Table */
    .table-wrap {
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    thead {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    th {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
      cursor: pointer;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface); }
    td {
      padding: 14px 16px;
      color: var(--text);
      vertical-align: top;
    }
    .td-id {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .td-name { font-weight: 500; white-space: nowrap; }
    .td-email {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--stat-total-color);
    }
    .td-subject {
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
    }
    .td-message {
      max-width: 240px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-muted);
      font-size: 12px;
    }
    .td-time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }

    /* Empty / Loading */
    .empty-row td {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 4px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      position: relative;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .modal-title {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      padding: 4px;
    }
    .modal-close:hover { color: var(--text); }
    .detail-row { margin-bottom: 1.25rem; }
    .detail-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .detail-value {
      font-size: 14px;
      color: var(--text);
      line-height: 1.6;
      word-break: break-all;
    }
    .detail-value.mono {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent);
    }
    .detail-message {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 2px;
      padding: 12px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid var(--border-light);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      .stats { grid-template-columns: 1fr; gap: 8px; }
      .container { padding: 1rem; }
      th:nth-child(1), td:nth-child(1),
      th:nth-child(4), td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>

<!-- Top accent line -->
<div class="header-accent-line"></div>

<header>
  <div class="logo">
    <span class="material-symbols-outlined">admin_panel_settings</span>
    ADMIN / お問い合わせ管理
  </div>
  <div class="header-right">
    <div class="status-dot"></div>
    <span class="status-text" id="header-status">--</span>
    <button class="btn-refresh" id="logout-btn" style="display:none;" onclick="logout()">
      <span class="material-symbols-outlined">logout</span>
      LOGOUT
    </button>
  </div>
</header>

<!-- Login -->
<div id="login-screen">
  <div class="login-card">
    <h2>ADMIN ACCESS</h2>
    <p>管理者パスワードを入力してください</p>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
    </div>
    <button class="btn-login" onclick="login()">ログイン</button>
    <div id="login-error" class="login-error">※ パスワードが正しくありません</div>
  </div>
</div>

<!-- Dashboard -->
<div id="dashboard">
  <div class="container">
    <div class="stats">
      <div class="stat stat-total">
        <span class="material-symbols-outlined stat-icon">inbox</span>
        <div class="stat-label">Total</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat stat-today">
        <span class="material-symbols-outlined stat-icon">today</span>
        <div class="stat-label">Today</div>
        <div class="stat-value" id="stat-today">—</div>
      </div>
      <div class="stat stat-updated">
        <span class="material-symbols-outlined stat-icon">update</span>
        <div class="stat-label">Last Updated</div>
        <div class="stat-value" id="stat-updated">—</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="toolbar-left">
        <span class="section-title">INQUIRIES</span>
      </div>
      <div style="display:flex; gap:0.75rem; align-items:center;">
        <div class="search-wrap">
          <span class="material-symbols-outlined">search</span>
          <input type="text" class="search-input" id="search" placeholder="名前・メールで検索..." oninput="filterTable()">
        </div>
        <button class="btn-refresh" onclick="loadData()">
          <span class="material-symbols-outlined">refresh</span>
          REFRESH
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>名前</th>
            <th>メールアドレス</th>
            <th>件名</th>
            <th>内容</th>
            <th>送信日時</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr class="empty-row"><td colspan="6"><span class="spinner"></span>読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">DETAIL</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div id="modal-content"></div>
  </div>
</div>

<script>
  const API = 'https://owk15xpdx7.execute-api.us-east-1.amazonaws.com/prod/contact';
  const ADMIN_PASSWORD = 'admin1234'; // ← パスワードを変更してください
  let allData = [];

  function login() {
    const pw = document.getElementById('password').value;
    if (pw === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'flex';
      loadData();
    } else {
      document.getElementById('login-error').style.display = 'block';
    }
  }

  function logout() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('logout-btn').style.display = 'none';
    document.getElementById('password').value = '';
    document.getElementById('login-error').style.display = 'none';
  }

  async function loadData() {
    const tbody = document.getElementById('table-body');
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6"><span class="spinner"></span>読み込み中...</td></tr>';
    document.getElementById('header-status').textContent = 'loading...';

    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('API error: ' + res.status);
      allData = await res.json();
      renderTable(allData);

      const today = new Date().toDateString();
      const todayCount = allData.filter(d => new Date(d.timestamp).toDateString() === today).length;
      document.getElementById('stat-total').textContent = allData.length;
      document.getElementById('stat-today').textContent = todayCount;
      document.getElementById('stat-updated').textContent = new Date().toLocaleTimeString('ja-JP');
      document.getElementById('header-status').textContent = allData.length + ' records';
    } catch (e) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">データの取得に失敗しました: ' + e.message + '</td></tr>';
      document.getElementById('header-status').textContent = 'error';
    }
  }

  function renderTable(data) {
    const tbody = document.getElementById('table-body');
    if (data.length === 0) {
      tbody.innerHTML = '<tr class="empty-row"><td colspan="6">データがありません</td></tr>';
      return;
    }
    tbody.innerHTML = data.map(item => `
      <tr onclick="showDetail('${item.id}')">
        <td class="td-id">${item.id ? item.id.substring(0, 8) + '...' : '—'}</td>
        <td class="td-name">${escape(item.name || '—')}</td>
        <td class="td-email">${escape(item.email || '—')}</td>
        <td class="td-subject">${escape(item.subject || '—')}</td>
        <td class="td-message">${escape(item.message || '—')}</td>
        <td class="td-time">${formatDate(item.timestamp)}</td>
      </tr>
    `).join('');
  }

  function filterTable() {
    const q = document.getElementById('search').value.toLowerCase();
    if (!q) { renderTable(allData); return; }
    const filtered = allData.filter(d =>
      (d.name || '').toLowerCase().includes(q) ||
      (d.email || '').toLowerCase().includes(q) ||
      (d.subject || '').toLowerCase().includes(q)
    );
    renderTable(filtered);
  }

  function showDetail(id) {
    const item = allData.find(d => d.id === id);
    if (!item) return;
    document.getElementById('modal-content').innerHTML = `
      <div class="detail-row">
        <div class="detail-label">ID</div>
        <div class="detail-value mono">${escape(item.id || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">送信日時</div>
        <div class="detail-value">${formatDateFull(item.timestamp)}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">お名前</div>
        <div class="detail-value">${escape(item.name || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">メールアドレス</div>
        <div class="detail-value mono">${escape(item.email || '—')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">件名</div>
        <div class="detail-value">${escape(item.subject || '件名なし')}</div>
      </div>
      <div class="detail-row">
        <div class="detail-label">お問い合わせ内容</div>
        <div class="detail-message">${escape(item.message || '—')}</div>
      </div>
    `;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal(e) {
    if (e.target === document.getElementById('modal')) closeModalDirect();
  }
  function closeModalDirect() {
    document.getElementById('modal').classList.remove('open');
  }

  function escape(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function formatDate(ts) {
    if (!ts) return '—';
    const d = new Date(ts);
    return d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  }

  function formatDateFull(ts) {
    if (!ts) return '—';
    return new Date(ts).toLocaleString('ja-JP');
  }
</script>
</body>
</html>
